name: Update

on:
  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: nomad
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: nix flake update --commit-lock-file

      - name: Update packages
        id: packages
        run: |
          before=$(git rev-parse HEAD)
          failed=()
          for hook in packages/*/update.sh; do
            pname=$(basename "$(dirname "$hook")")
            echo "::group::$pname"
            scripts/update.sh "$pname" || failed+=("$pname")
            echo "::endgroup::"
          done

          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "updated=1" >>"$GITHUB_OUTPUT"
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            echo "failed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate
        run: nix flake check --all-systems --no-build

      - name: Push
        if: steps.packages.outputs.updated == '1'
        run: git push

      - name: Report updater failures
        if: steps.packages.outputs.failed == '1'
        run: exit 1

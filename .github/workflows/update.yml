name: Update

on:
  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: nomad
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: nix flake update --commit-lock-file

      # One upstream being unreachable must not hold back the packages that did
      # update, nor the lock file; failures are reported after the push instead.
      - name: Update package hashes
        id: hashes
        run: |
          failed=()
          for script in packages/*/update-hashes.sh; do
            "$script" || failed+=("$script")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            echo "failed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate and push
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            nix flake check --all-systems --no-build
            git push
          fi

      - name: Report updater failures
        if: steps.hashes.outputs.failed == '1'
        run: exit 1

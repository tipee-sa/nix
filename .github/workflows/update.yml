name: Update

on:
  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

# Not redundant with the block in cache.yml: a called workflow can only
# downgrade what its caller grants, and the repository default is write.
permissions:
  contents: read

jobs:
  update:
    runs-on: nomad
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: nix flake update --commit-lock-file

      - name: Update packages
        id: packages
        run: |
          before=$(git rev-parse HEAD)
          failed=()
          for hook in packages/*/update.sh; do
            pname=$(basename "$(dirname "$hook")")
            echo "::group::$pname"
            scripts/update.sh "$pname" || failed+=("$pname")
            echo "::endgroup::"
          done

          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "updated=1" >>"$GITHUB_OUTPUT"
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            echo "failed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate
        run: nix flake check --all-systems --no-build

      - name: Push
        id: push
        if: steps.packages.outputs.updated == '1'
        run: |
          git push
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Report updater failures
        if: steps.packages.outputs.failed == '1'
        run: exit 1

  # Not `success()`: a commit that was pushed still needs caching even when a
  # different package's updater failed afterwards.
  cache:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.sha != '' }}
    uses: ./.github/workflows/cache.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit

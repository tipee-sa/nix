name: Update cockroach

on:
  schedule:
    - cron: "23 4 * * 1"
      timezone: "Europe/Zurich"
  workflow_dispatch:

concurrency:
  group: update-cockroach
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: false

      # cockroachdb is wrapped in buildFHSEnv, which runs bwrap. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor; without this
      # the build succeeds but running the binary to check its version fails.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update cockroachdb and molt
        run: scripts/update-cockroach.sh --commit

      # --all-systems is omitted on purpose: packages.aarch64-darwin.molt does
      # not evaluate, since molt.nix has no darwin source.
      - name: Validate and push
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            nix flake check --no-build
            git push
          fi
